name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar ambiente
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv git zip unzip
      - name: Verificar projeto
        run: |
          python3 --version
          ls -la
